[exchange]
name=binance
api_url=https://api.binance.com
ws_url=wss://stream.binance.com:9443/ws/
# API keys from environment: BINANCE_API_KEY, BINANCE_SECRET_KEY
# WARNING: Never commit API keys to version control

[symbols]
pairs=BTC/USDT,ETH/USDT,SOL/USDT,ADA/USDT

[rate_limits]
# Binance uses request weight system
weight_per_minute=1200
orders_per_10sec=100

[streams]
# WebSocket streams configuration
trade_stream_suffix=@trade
orderbook_stream_suffix=@depth@100ms
# Combined stream URL format: wss://stream.binance.com:9443/stream?streams=btcusdt@trade/ethusdt@trade
